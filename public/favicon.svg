<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#grad)" stroke-width="2.5" filter="url(#glow)"/>
  <!-- AI Chip Brain outline -->
  <rect x="23" y="23" width="18" height="18" rx="4" fill="#1e293b" stroke="url(#grad)" stroke-width="2"/>
  <!-- Circuit Nodes -->
  <path d="M17 27h6 M17 37h6 M41 27h6 M41 37h6 M27 17v6 M37 17v6 M27 41v6 M37 41v6" stroke="url(#grad)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="15" cy="27" r="1.5" fill="#38bdf8"/>
  <circle cx="15" cy="37" r="1.5" fill="#38bdf8"/>
  <circle cx="49" cy="27" r="1.5" fill="#818cf8"/>
  <circle cx="49" cy="37" r="1.5" fill="#818cf8"/>
  <!-- AI text -->
  <text x="32" y="35.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">AI</text>
  <!-- Sparkle scale arrow -->
  <path d="M42 20l6-4m0 0h-4m4 0v4" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
